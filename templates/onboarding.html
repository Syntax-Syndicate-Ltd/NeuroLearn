{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto pt-8">
    <!-- Progress Dots -->
    <div class="flex justify-center gap-4 mb-12">
        <div id="dot-1" class="w-3 h-3 rounded-full transition-all duration-300" style="background: #10B981; box-shadow: 0 0 10px rgba(16,185,129,0.4);"></div>
        <div id="dot-2" class="w-3 h-3 rounded-full transition-all duration-300" style="background: #CBD5E1;"></div>
        <div id="dot-3" class="w-3 h-3 rounded-full transition-all duration-300" style="background: #CBD5E1;"></div>
    </div>

    <div class="relative overflow-hidden min-h-[500px]">
        
        <!-- Step 1: Name -->
        <div id="step-1" class="wizard-step flex flex-col items-center justify-center p-8 text-center transition-all duration-500">
            <h2 class="text-4xl font-black font-heading mb-8" style="color: #1E293B;">What should we call you?</h2>
            <div class="relative w-full max-w-md">
                <input type="text" id="student-name" value="{{ name }}" 
                       class="w-full bg-white text-3xl font-black text-center py-5 px-6 rounded-2xl outline-none transition-all font-heading text-slate-800 placeholder-slate-400 shadow-md"
                       style="border: 3px solid #0EA5E9; box-shadow: 0 6px 0 #0284C7;"
                       placeholder="Enter Your Name" autofocus>
                <p class="text-base font-bold mt-6" style="color: #64748B;">This is how your AI tutor will address you throughout the journey.</p>
            </div>
            <button onclick="nextStep(2)" class="btn-primary mt-10 px-14 py-4 text-xl">
                NEXT <i class="fas fa-chevron-right ml-2 text-sm"></i>
            </button>
        </div>

        <!-- Step 2: Cognitive Style -->
        <div id="step-2" class="wizard-step hidden opacity-0 translate-x-12 flex flex-col items-center p-8 transition-all duration-500">
            <h2 class="text-3xl font-black font-heading mb-10 text-center" style="color: #1E293B;">How do you want to learn today?</h2>
            
            <div class="grid md:grid-cols-2 gap-8 w-full max-w-4xl">
                <button type="button" onclick="selectStyle('focus')" class="style-card glass group p-8 text-left transition-all hover:scale-[1.02] overflow-hidden relative cursor-pointer" id="card-focus">
                    <div class="relative z-10">
                        <div class="flex items-center gap-4 mb-4">
                            <span class="text-4xl">⚓</span>
                            <h3 class="text-2xl font-black font-heading" style="color: #1E293B;">Focus Mode</h3>
                        </div>
                        <p class="text-xs font-black uppercase tracking-widest mb-3" style="color: #8B5CF6;">Structured • Calm • Deep Dives</p>
                        <p class="text-sm font-semibold leading-relaxed" style="color: #64748B;">Perfect for complex topics. Your AI tutor speaks in rich, metaphorical prose at a measured pace.</p>
                    </div>
                </button>

                <button type="button" onclick="selectStyle('energy')" class="style-card glass group p-8 text-left transition-all hover:scale-[1.02] overflow-hidden relative cursor-pointer" id="card-energy">
                    <div class="relative z-10">
                        <div class="flex items-center gap-4 mb-4">
                            <span class="text-4xl">⚡</span>
                            <h3 class="text-2xl font-black font-heading" style="color: #1E293B;">Energy Mode</h3>
                        </div>
                        <p class="text-xs font-black uppercase tracking-widest mb-3" style="color: #0EA5E9;">Fast • Punchy • Hyped Up</p>
                        <p class="text-sm font-semibold leading-relaxed" style="color: #64748B;">Turbocharge your learning. Your AI tutor speaks with rhythm and drive — like a hype coach.</p>
                    </div>
                </button>
            </div>
            
            <div class="flex gap-4 mt-12 w-full max-w-4xl">
                <button type="button" onclick="nextStep(1)" class="btn-secondary px-8">Back</button>
                <button type="button" onclick="nextStep(3)" class="btn-primary flex-1 py-4 text-lg" id="btn-next-2" disabled>Continue Choosing Style...</button>
            </div>
        </div>

        <!-- Step 3: Expression & Voice -->
        <div id="step-3" class="wizard-step hidden opacity-0 translate-x-12 flex flex-col items-center p-8 transition-all duration-500">
            <h2 class="text-3xl font-black font-heading mb-10 text-center" style="color: #1E293B;">Finalizing Your Experience</h2>
            
            <div class="grid md:grid-cols-2 gap-8 w-full max-w-4xl">
                <div class="space-y-4">
                    <label class="text-xs font-black uppercase tracking-widest block" style="color: #EC4899;">Your Narrator's Voice</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="cursor-pointer block">
                            <input type="radio" name="voice" value="standard_female" checked class="hidden">
                            <div class="opt-card p-4 text-center flex flex-col items-center justify-center">
                                <i class="fas fa-venus text-2xl mb-1 text-pink-500"></i>
                                <p class="text-xs font-extrabold leading-tight">Standard<br>Female</p>
                            </div>
                        </label>
                        <label class="cursor-pointer block">
                            <input type="radio" name="voice" value="standard_male" class="hidden">
                            <div class="opt-card p-4 text-center flex flex-col items-center justify-center">
                                <i class="fas fa-mars text-2xl mb-1 text-sky-500"></i>
                                <p class="text-xs font-extrabold leading-tight">Standard<br>Male</p>
                            </div>
                        </label>
                        <label class="cursor-pointer block">
                            <input type="radio" name="voice" value="fun_female" class="hidden">
                            <div class="opt-card p-4 text-center flex flex-col items-center justify-center">
                                <span class="text-2xl mb-1 block">✨</span>
                                <p class="text-xs font-extrabold leading-tight">Energetic<br>Female</p>
                            </div>
                        </label>
                        <label class="cursor-pointer block">
                            <input type="radio" name="voice" value="fun_male" class="hidden">
                            <div class="opt-card p-4 text-center flex flex-col items-center justify-center">
                                <span class="text-2xl mb-1 block">⚡</span>
                                <p class="text-xs font-extrabold leading-tight">Energetic<br>Male</p>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="space-y-4">
                    <label class="text-xs font-black uppercase tracking-widest block" style="color: #0EA5E9;">How are you feeling?</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="cursor-pointer block">
                            <input type="radio" name="emotion" value="great" checked class="hidden">
                            <div class="opt-card p-4 text-center">
                                <span class="text-3xl mb-1 block">😄</span>
                                <p class="text-xs font-extrabold uppercase">Great</p>
                            </div>
                        </label>
                        <label class="cursor-pointer block">
                            <input type="radio" name="emotion" value="okay" class="hidden">
                            <div class="opt-card p-4 text-center">
                                <span class="text-3xl mb-1 block">😐</span>
                                <p class="text-xs font-extrabold uppercase">Okay</p>
                            </div>
                        </label>
                        <label class="cursor-pointer block">
                            <input type="radio" name="emotion" value="tired" class="hidden">
                            <div class="opt-card p-4 text-center">
                                <span class="text-3xl mb-1 block">😴</span>
                                <p class="text-xs font-extrabold uppercase">Tired</p>
                            </div>
                        </label>
                        <label class="cursor-pointer block">
                            <input type="radio" name="emotion" value="anxious" class="hidden">
                            <div class="opt-card p-4 text-center">
                                <span class="text-3xl mb-1 block">😰</span>
                                <p class="text-xs font-extrabold uppercase">Anxious</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Language Selection -->
                <div class="space-y-4 md:col-span-2">
                    <label class="text-xs font-black uppercase tracking-widest block" style="color: #10B981;">Language of Learning</label>
                    <div class="flex flex-wrap gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="preferred_language" value="en" checked class="hidden">
                            <div class="opt-card px-6 py-3 text-center rounded-full">
                                <p class="text-sm font-extrabold">English</p>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="preferred_language" value="hi" class="hidden">
                            <div class="opt-card px-6 py-3 text-center rounded-full">
                                <p class="text-sm font-extrabold">हिंदी</p>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="preferred_language" value="mr" class="hidden">
                            <div class="opt-card px-6 py-3 text-center rounded-full">
                                <p class="text-sm font-extrabold">मराठी</p>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="preferred_language" value="ta" class="hidden">
                            <div class="opt-card px-6 py-3 text-center rounded-full">
                                <p class="text-sm font-extrabold">தமிழ்</p>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="preferred_language" value="te" class="hidden">
                            <div class="opt-card px-6 py-3 text-center rounded-full">
                                <p class="text-sm font-extrabold">తెలుగు</p>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-4 mt-12 w-full max-w-4xl">
                <button type="button" onclick="nextStep(2)" class="btn-secondary px-8">Back</button>
                <button type="button" onclick="startProcessing()" class="btn-primary flex-1 py-4 text-xl">
                    LET'S BUILD YOUR COURSE →
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    .wizard-step.hidden { display: none; }
    
    /* Style Cards (Step 2) */
    .style-card {
        background: #FFFFFF !important;
        border: 3px solid #E2E8F0 !important;
        border-radius: 24px !important;
        transition: all 0.2s ease !important;
    }
    .style-card.active {
        border-color: #8B5CF6 !important;
        box-shadow: 0 8px 24px rgba(139, 92, 246, 0.25) !important;
        background: #F5F3FF !important;
    }
    .style-card.active#card-energy {
        border-color: #0EA5E9 !important;
        box-shadow: 0 8px 24px rgba(14, 165, 233, 0.25) !important;
        background: #F0F9FF !important;
    }

    /* Option Cards (Step 3) */
    .opt-card {
        background: #FFFFFF !important;
        border: 3px solid #E2E8F0 !important;
        border-radius: 20px !important;
        color: #1E293B !important;
        transition: all 0.2s ease !important;
        cursor: pointer;
    }
    .opt-card:hover {
        border-color: #10B981 !important;
        background: #F0FDF4 !important;
        transform: translateY(-2px);
    }
    input[type="radio"]:checked + .opt-card {
        background: #E6F4EA !important;
        border-color: #10B981 !important;
        box-shadow: 0 6px 18px rgba(16, 185, 129, 0.3) !important;
        color: #047857 !important;
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block scripts %}
<script>
    let currentStep = 1;
    let selectedStyle = null;

    function nextStep(step) {
        if (currentStep === 1 && !document.getElementById('student-name').value.trim()) {
            alert("Please enter your name first!");
            return;
        }

        const currentEl = document.getElementById(`step-${currentStep}`);
        currentEl.classList.add('opacity-0', 'translate-x-[-12px]');
        setTimeout(() => {
            currentEl.classList.add('hidden');
            const nextEl = document.getElementById(`step-${step}`);
            nextEl.classList.remove('hidden');
            setTimeout(() => {
                nextEl.classList.remove('opacity-0', 'translate-x-12');
                currentStep = step;
                updateDots();
            }, 10);
        }, 300);
    }

    function updateDots() {
        for (let i = 1; i <= 3; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if (i <= currentStep) {
                dot.style.background = '#10B981';
                dot.style.boxShadow = '0 0 10px rgba(16,185,129,0.4)';
            } else {
                dot.style.background = '#CBD5E1';
                dot.style.boxShadow = 'none';
            }
        }
    }

    function selectStyle(style) {
        selectedStyle = style;
        document.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
        document.getElementById(`card-${style}`).classList.add('active');
        
        const btn = document.getElementById('btn-next-2');
        btn.disabled = false;
        btn.textContent = `CONTINUE WITH ${style.toUpperCase()} MODE →`;
    }

    async function startProcessing() {
        const payload = {
            name: document.getElementById('student-name').value,
            style: selectedStyle,
            voice: document.querySelector('input[name="voice"]:checked').value,
            emotion: document.querySelector('input[name="emotion"]:checked').value,
            preferred_language: document.querySelector('input[name="preferred_language"]:checked')?.value || 'en'
        };

        const response = await fetch('/onboarding', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.redirect) window.location.href = result.redirect;
    }
</script>
{% endblock %}
