{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto pt-8 md:pt-12 animate-slide-up">
    <!-- Header -->
    <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-emerald-500 text-white flex items-center justify-center text-2xl shadow-lg">
            <i class="fas fa-sign-in-alt"></i>
        </div>
        <h1 class="text-3xl font-black text-slate-900 mb-2">Welcome Back!</h1>
        <p class="text-slate-500 font-bold text-sm">Sign in to continue your level path</p>
    </div>

    <!-- Error Message -->
    {% if error %}
    <div class="p-4 mb-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-sm font-bold flex items-center gap-2">
        <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="POST" action="/login" class="glass p-8 space-y-6 relative overflow-hidden" style="border-radius: 28px;">
        <div class="space-y-2">
            <label class="text-xs font-black uppercase tracking-wider text-slate-600" for="login-id">Username or Email</label>
            <input type="text" name="login_id" id="login-id" value="{{ login_id }}" required
                   class="w-full rounded-xl px-4 py-3.5 outline-none font-bold text-slate-800 border-2 border-slate-200 focus:border-emerald-500 bg-slate-50"
                   placeholder="Enter your username or email" autofocus>
        </div>

        <div class="space-y-2">
            <label class="text-xs font-black uppercase tracking-wider text-slate-600" for="login-password">Password</label>
            <div class="relative">
                <input type="password" name="password" id="login-password" required
                       class="w-full rounded-xl px-4 py-3.5 outline-none font-bold text-slate-800 border-2 border-slate-200 focus:border-emerald-500 bg-slate-50 pr-12"
                       placeholder="Enter password">
                <button type="button" onclick="togglePassword('login-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn-primary w-full py-4 text-base font-black">
            SIGN IN →
        </button>
    </form>

    <div class="text-center mt-8 mb-16">
        <p class="text-slate-500 font-bold text-sm">Don't have an account?
            <a href="/signup" class="font-black text-emerald-600 underline ml-1">Create Account →</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }
</script>
{% endblock %}
