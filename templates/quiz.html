{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto pt-6 pb-20 animate-slide-up" id="main-content">
    <!-- Top Header & Progress Bar -->
    <div class="flex items-center gap-4 mb-6">
        <a href="/chapters" class="text-2xl font-black text-gray-400 hover:text-gray-600 transition-colors px-2" title="Quit Quiz">✕</a>
        <div class="flex-1">
            <div class="progress-segmented" id="quiz-progress-segmented">
                <div class="progress-segment current"></div>
                <div class="progress-segment"></div>
                <div class="progress-segment"></div>
                <div class="progress-segment"></div>
            </div>
        </div>
        <div class="flex items-center gap-1 font-black text-sm px-3 py-1.5 rounded-full" style="background: #FFF9E6; border: 2px solid #FFC800; color: #D97706;">
            ⚡ <span id="running-xp">0</span> XP
        </div>
    </div>

    <!-- Main Quiz Card -->
    <div id="quiz-card" class="glass p-8 md:p-12 relative overflow-hidden" style="border-radius: 28px; background: #FFFFFF; border: 2px solid #E2E8F0; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);">
        <!-- Question Meta Header -->
        <div class="flex justify-between items-center mb-6">
            <span class="text-xs font-black uppercase tracking-widest px-3 py-1 rounded-full bg-emerald-100 text-emerald-800">
                QUESTION <span id="current-q">1</span> / <span id="total-q">4</span>
            </span>
            <div id="difficulty-badge" class="text-xs font-black uppercase tracking-widest px-3 py-1 rounded-full"
                 style="background: #E0F2FE; color: #0284C7; border: 1px solid #BAE6FD;">EASY</div>
        </div>
        
        <!-- Question Text -->
        <h2 id="question-text" class="text-2xl md:text-3xl font-black font-heading mb-8 leading-snug tracking-tight" style="color: #0F172A;">
            Loading question...
        </h2>

        <!-- Answer Options Group -->
        <div id="options-container" class="grid gap-4 mb-8" role="group" aria-labelledby="question-text">
            <!-- Options injected here dynamically as .answer-card elements -->
        </div>

        <!-- Explanation Banner -->
        <div id="explanation-panel" class="hidden p-5 mb-8 animate-slide-up rounded-2xl"
             style="background: #FFFBEB; border: 2px solid #FCD34D;">
            <p class="text-base font-extrabold" style="color: #B45309;" id="explanation-text">...</p>
        </div>

        <!-- Action Footer -->
        <div class="flex flex-col sm:flex-row items-stretch justify-between pt-6 border-t-2 border-slate-100 gap-4">
            <button id="btn-voice" class="btn-secondary flex-1 flex items-center justify-center gap-2 text-xs sm:text-sm font-extrabold px-4 py-3 sm:py-4 rounded-2xl border-2 border-slate-200 hover:bg-slate-50 transition-all text-center">
                🎙️ SPEAK ANSWER
            </button>
            
            <button id="btn-next" class="btn-primary flex-1 text-xs sm:text-sm font-black px-4 py-3 sm:py-4 min-h-[50px] !m-0" disabled>
                NEXT QUESTION →
            </button>
        </div>
    </div>
</div>

<script>
    window.chapterId = "{{ chapter.chapter_id }}";
</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
{% endblock %}
